<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ereignis-Viewer</title>
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#">Ereignisse</a>
    <nav id="crumbs" class="crumbs"></nav>
    <span class="spacer"></span>
    <span id="status" class="status"></span>
    <div class="seg theme" role="group" aria-label="Darstellung" id="theme">
      <button type="button" data-v="system" title="Wie System" aria-label="Wie System">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button type="button" data-v="light" title="Hell" aria-label="Hell">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-v="dark" title="Dunkel" aria-label="Dunkel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <button id="btn-refresh" class="icon-btn" title="Aktualisieren" aria-label="Aktualisieren">⟳</button>
    <button id="btn-filter" class="icon-btn only-mobile" aria-expanded="false" aria-controls="filters" title="Filter">☰</button>
  </div>
  <form id="filters" class="filters" autocomplete="off" onsubmit="return false">
    <div class="seg" role="group" aria-label="Kamera" id="f-cam"></div>
    <div class="chips" role="group" aria-label="Typ">
      <label class="chip person"><input type="checkbox" id="f-person"> Personen</label>
      <label class="chip bike" title="Fahrräder und Motorräder"><input type="checkbox" id="f-bike"> Räder</label>
      <label class="chip vehicle"><input type="checkbox" id="f-vehicle"> Fahrzeuge</label>
    </div>
    <div class="seg" role="group" aria-label="Tageszeit" id="f-light">
      <button type="button" data-v="all">Tag &amp; Nacht</button>
      <button type="button" data-v="day">Tag</button>
      <button type="button" data-v="night">Nacht</button>
    </div>
    <label class="toggle" title="Fahrzeuge nur nah und bewegt, Räder nur bewegt"><input type="checkbox" id="f-near"> nur nah &amp; bewegt</label>
    <div class="seg" role="group" aria-label="Prüfung" id="f-rv">
      <button type="button" data-v="" title="Alle außer Fehlalarmen">Alle</button>
      <button type="button" data-v="open" title="Noch nicht nachklassifiziert">Offen</button>
      <button type="button" data-v="done" title="Von Hand geprüft oder korrigiert">Geprüft</button>
      <button type="button" data-v="fp" title="Fehlalarme, unsichere Erkennungen und Sonstiges (Tiere)">Fehlalarme</button>
    </div>
    <div class="range">
      <input type="date" id="f-from" aria-label="von">
      <span>–</span>
      <input type="date" id="f-to" aria-label="bis">
    </div>
    <input type="search" id="f-q" placeholder="Kennzeichen / Fahrzeug" aria-label="Kennzeichen oder Fahrzeug suchen">
  </form>
</header>

<main id="main"></main>

<aside id="detail" class="detail" hidden aria-label="Ereignisdetail"></aside>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
